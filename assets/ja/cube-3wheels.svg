<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
  <defs>
    <marker id="c3h" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#c62828"/>
    </marker>
    <marker id="c3b" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="620" height="400" fill="#ffffff"/>
  <text x="310" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">3軸への拡張：コーナーで立つ立方体＋3つのホイール</text>

  <!-- cube faces (corner-down hexagon) -->
  <polygon points="205,160 310,100 415,160 310,220" fill="#eceff1" stroke="#455a64" stroke-width="2.5"/>
  <polygon points="415,160 415,280 310,340 310,220" fill="#cfd8dc" stroke="#455a64" stroke-width="2.5"/>
  <polygon points="310,220 310,340 205,280 205,160" fill="#b0bec5" stroke="#455a64" stroke-width="2.5"/>

  <!-- reaction wheels on the 3 faces (ellipses) -->
  <g stroke="#1565c0" stroke-width="2.5" fill="#e3f2fd">
    <ellipse cx="310" cy="158" rx="34" ry="17"/>
    <ellipse cx="362" cy="242" rx="17" ry="34"/>
    <ellipse cx="258" cy="242" rx="17" ry="34"/>
  </g>
  <g fill="#1565c0">
    <circle cx="310" cy="158" r="4"/>
    <circle cx="362" cy="242" r="4"/>
    <circle cx="258" cy="242" r="4"/>
  </g>
  <!-- spin hints -->
  <path d="M286,152 A30 15 0 0 1 334,152" fill="none" stroke="#1565c0" stroke-width="2" marker-end="url(#c3b)"/>

  <!-- standing point -->
  <circle cx="310" cy="340" r="4.5" fill="#333"/>
  <line x1="250" y1="356" x2="370" y2="356" stroke="#555" stroke-width="2"/>
  <path d="M262,356 l-9,10 M286,356 l-9,10 M310,356 l-9,10 M334,356 l-9,10 M358,356 l-9,10" stroke="#999" stroke-width="1.4"/>
  <text x="378" y="352" font-size="12.5" fill="#333">接地点は1点だけ</text>

  <!-- gravity -->
  <line x1="470" y1="150" x2="470" y2="250" stroke="#c62828" stroke-width="3" marker-end="url(#c3h)"/>
  <text x="480" y="205" font-size="14" fill="#c62828">重力 g</text>

  <!-- labels -->
  <text x="310" y="88" text-anchor="middle" font-size="13" fill="#455a64">立方体（コーナーで立つ）</text>
  <text x="150" y="150" font-size="12.5" fill="#1565c0">3つのリアクション</text>
  <text x="150" y="168" font-size="12.5" fill="#1565c0">ホイール（X・Y・Z軸）</text>
  <line x1="150" y1="200" x2="238" y2="238" stroke="#90a4ae" stroke-width="1" stroke-dasharray="3 3"/>

  <text x="310" y="386" text-anchor="middle" font-size="12.5" fill="#555">第2回の「1軸」→ 3軸へ。3方向のバランスを、3つのホイールで同時に取る。</text>
</svg>
