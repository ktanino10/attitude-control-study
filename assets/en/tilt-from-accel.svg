<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <marker id="ta" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#455a64"/></marker>
    <marker id="tg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#c62828"/></marker>
  </defs>
  <rect x="0" y="0" width="620" height="400" fill="#ffffff"/>
  <text x="310" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">Sensing tilt with accelerometers</text>

  <g>
    <circle cx="230" cy="230" r="4" fill="#455a64"/>
    <line x1="230" y1="230" x2="230" y2="110" stroke="#90a4ae" stroke-width="2.4" marker-end="url(#ta)"/>
    <text x="238" y="118" font-size="13" fill="#607d8b">Z_B</text>
    <line x1="230" y1="230" x2="130" y2="286" stroke="#90a4ae" stroke-width="2.4" marker-end="url(#ta)"/>
    <text x="104" y="300" font-size="13" fill="#607d8b">X_B</text>
    <line x1="230" y1="230" x2="338" y2="272" stroke="#90a4ae" stroke-width="2.4" marker-end="url(#ta)"/>
    <text x="344" y="278" font-size="13" fill="#607d8b">Y_B</text>
  </g>

  <line x1="230" y1="230" x2="292" y2="342" stroke="#c62828" stroke-width="3.4" marker-end="url(#tg)"/>
  <text x="298" y="342" font-size="14" fill="#c62828" font-weight="bold">gravity vector ᴮg</text>
  <text x="150" y="352" font-size="12.5" fill="#c62828">(the true "down")</text>

  <path d="M230,150 A80 80 0 0 1 258,168" fill="none" stroke="#455a64" stroke-width="1.5"/>
  <text x="250" y="150" font-size="12" fill="#455a64">tilt</text>

  <text x="470" y="110" text-anchor="middle" font-size="13" fill="#1565c0">6 accelerometers</text>
  <text x="470" y="130" text-anchor="middle" font-size="12.5" fill="#607d8b">↓ combine by least squares</text>
  <rect x="376" y="146" width="196" height="70" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.6"/>
  <text x="474" y="172" text-anchor="middle" font-size="12.5" fill="#1565c0">Estimate gravity direction ᴮg</text>
  <text x="474" y="194" text-anchor="middle" font-size="12.5" fill="#1565c0">→ gives pitch β and roll γ</text>

  <text x="474" y="250" text-anchor="middle" font-size="12.5" fill="#8d6e63">⚠ Yaw α can't be found from gravity</text>
  <text x="474" y="270" text-anchor="middle" font-size="11.5" fill="#a1887f">(spinning about vertical keeps "down" the same)</text>

  <text x="310" y="384" text-anchor="middle" font-size="12.5" fill="#555">Seen in body axes, the "down" (gravity) direction tells you how much the body is tilted (β, γ).</text>
</svg>
