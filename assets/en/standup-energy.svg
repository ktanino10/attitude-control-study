<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <marker id="sh" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1565c0"/>
    </marker>
    <marker id="shr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#c62828"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="320" fill="#ffffff"/>
  <text x="340" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">How it stands up: charge, release, flip</text>

  <line x1="233" y1="52" x2="233" y2="300" stroke="#eee" stroke-width="2"/>
  <line x1="453" y1="52" x2="453" y2="300" stroke="#eee" stroke-width="2"/>

  <text x="116" y="74" text-anchor="middle" font-size="15" font-weight="bold" fill="#1565c0">1. Charge</text>
  <line x1="40" y1="250" x2="200" y2="250" stroke="#555" stroke-width="2"/>
  <rect x="60" y="228" width="120" height="18" rx="6" fill="#d7ccc8" stroke="#8d6e63" stroke-width="2"/>
  <circle cx="150" cy="200" r="26" fill="#e3f2fd" stroke="#1565c0" stroke-width="3"/>
  <path d="M132,182 A24 24 0 1 1 128,214" fill="none" stroke="#1565c0" stroke-width="2.4" marker-end="url(#sh)"/>
  <text x="116" y="150" text-anchor="middle" font-size="13" fill="#1565c0">spin the wheel fast</text>
  <text x="116" y="168" text-anchor="middle" font-size="13" fill="#1565c0">large ω_w</text>
  <text x="116" y="286" text-anchor="middle" font-size="12" fill="#555">store spin (angular momentum)</text>

  <text x="343" y="74" text-anchor="middle" font-size="15" font-weight="bold" fill="#c62828">2. Release (brake)</text>
  <line x1="260" y1="250" x2="420" y2="250" stroke="#555" stroke-width="2"/>
  <rect x="280" y="228" width="120" height="18" rx="6" fill="#d7ccc8" stroke="#8d6e63" stroke-width="2"/>
  <circle cx="370" cy="200" r="26" fill="#ffebee" stroke="#c62828" stroke-width="3"/>
  <rect x="392" y="192" width="10" height="16" rx="2" fill="#c62828"/>
  <text x="343" y="150" text-anchor="middle" font-size="13" fill="#c62828" font-weight="bold">hard brake!</text>
  <text x="343" y="168" text-anchor="middle" font-size="12.5" fill="#c62828">spin passes to body</text>
  <path d="M330,182 q-16,10 -6,30" fill="none" stroke="#c62828" stroke-width="2.2" marker-end="url(#shr)"/>
  <text x="343" y="286" text-anchor="middle" font-size="12" fill="#555">momentum conserved → body turns</text>

  <text x="566" y="74" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e7d32">3. Stand up</text>
  <line x1="480" y1="250" x2="640" y2="250" stroke="#555" stroke-width="2"/>
  <g transform="rotate(-60 560 250)">
    <rect x="500" y="232" width="120" height="18" rx="6" fill="#d7ccc8" stroke="#8d6e63" stroke-width="2"/>
    <circle cx="610" cy="241" r="20" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/>
  </g>
  <path d="M560,250 A70 70 0 0 1 596,196" fill="none" stroke="#2e7d32" stroke-width="2.2" marker-end="url(#shr)"/>
  <text x="566" y="150" text-anchor="middle" font-size="13" fill="#2e7d32">CoM lifts up</text>
  <text x="566" y="168" text-anchor="middle" font-size="13" fill="#2e7d32">θb ↑ toward upright</text>
  <text x="566" y="286" text-anchor="middle" font-size="12" fill="#555">spin energy → height (potential) energy</text>
</svg>
