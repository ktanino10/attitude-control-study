<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#333"/>
    </marker>
    <marker id="ahb" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="560" height="460" fill="#ffffff"/>
  <text x="280" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">1-D model (inverted pendulum + wheel)</text>

  <line x1="70" y1="392" x2="360" y2="392" stroke="#555" stroke-width="2"/>
  <path d="M80,392 l-10,12 M110,392 l-10,12 M140,392 l-10,12 M170,392 l-10,12 M200,392 l-10,12 M230,392 l-10,12 M260,392 l-10,12 M290,392 l-10,12 M320,392 l-10,12" stroke="#999" stroke-width="1.5"/>

  <line x1="180" y1="392" x2="180" y2="80" stroke="#2e7d32" stroke-width="1.6" stroke-dasharray="7 5"/>
  <text x="188" y="92" font-size="13" fill="#2e7d32">Upright (θb = 0)</text>

  <line x1="180" y1="392" x2="285" y2="128" stroke="#8d6e63" stroke-width="9" stroke-linecap="round"/>

  <circle cx="238" cy="264" r="6" fill="#5d4037"/>
  <text x="248" y="262" font-size="13" fill="#5d4037">Body CoM</text>

  <circle cx="285" cy="128" r="40" fill="#e3f2fd" stroke="#1565c0" stroke-width="3"/>
  <circle cx="285" cy="128" r="5" fill="#1565c0"/>
  <path d="M258,101 A38 38 0 0 1 312,101" fill="none" stroke="#1565c0" stroke-width="2.4" marker-end="url(#ahb)"/>
  <text x="285" y="70" text-anchor="middle" font-size="13" fill="#1565c0">θw (wheel angle)</text>
  <text x="330" y="150" font-size="13" fill="#1565c0">Wheel</text>
  <text x="330" y="168" font-size="12" fill="#1565c0">(motor-driven)</text>

  <circle cx="180" cy="392" r="7" fill="#333"/>
  <text x="150" y="414" font-size="13" fill="#333">Pivot</text>

  <path d="M180,262 A130 130 0 0 1 218,276" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="146" y="210" font-size="15" fill="#333" font-weight="bold">θb</text>
  <text x="112" y="228" font-size="11" fill="#666">(body angle)</text>

  <line x1="315" y1="145" x2="210" y2="409" stroke="#bbb" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="300" y="300" font-size="14" fill="#8d6e63" font-style="italic">l</text>
  <text x="300" y="316" font-size="11" fill="#8d6e63">pivot→wheel axis</text>

  <text x="196" y="320" font-size="14" fill="#5d4037" font-style="italic">lb</text>

  <line x1="440" y1="120" x2="440" y2="215" stroke="#c62828" stroke-width="3" marker-end="url(#ah)"/>
  <text x="450" y="175" font-size="15" fill="#c62828">gravity g</text>
  <text x="404" y="112" font-size="12" fill="#c62828">(down)</text>

  <text x="280" y="446" text-anchor="middle" font-size="12.5" fill="#555">Spinning the wheel rotates the body about the pivot by reaction — fighting the fall (gravity).</text>
</svg>
