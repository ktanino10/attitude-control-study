<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" font-family="sans-serif">
  <rect width="640" height="470" fill="#ffffff"/>
  <text x="320" y="34" font-size="20" font-weight="bold" text-anchor="middle" fill="#222">The three rotations that define attitude (roll, pitch, yaw)</text>

  <!-- satellite body (cube in simple isometric) -->
  <g stroke="#333" stroke-width="2" fill="#dfe9f5">
    <polygon points="270,250 370,250 410,215 310,215"/>
    <polygon points="270,250 270,330 370,330 370,250" fill="#c7d8ee"/>
    <polygon points="370,250 410,215 410,295 370,330" fill="#b0c6e2"/>
  </g>
  <text x="340" y="300" font-size="13" text-anchor="middle" fill="#333">Satellite</text>

  <!-- X axis (Roll) - to the right -->
  <line x1="340" y1="272" x2="560" y2="272" stroke="#d9480f" stroke-width="3"/>
  <polygon points="560,272 548,266 548,278" fill="#d9480f"/>
  <text x="565" y="277" font-size="15" font-weight="bold" fill="#d9480f">X</text>
  <path d="M 520 300 A 30 30 0 1 1 519 244" fill="none" stroke="#d9480f" stroke-width="2.5"/>
  <polygon points="519,244 512,254 525,256" fill="#d9480f"/>
  <text x="430" y="330" font-size="14" fill="#d9480f">Roll = about the front-back axis</text>

  <!-- Y axis (Pitch) - up-left iso -->
  <line x1="340" y1="272" x2="150" y2="200" stroke="#2b8a3e" stroke-width="3"/>
  <polygon points="150,200 163,201 158,212" fill="#2b8a3e"/>
  <text x="128" y="196" font-size="15" font-weight="bold" fill="#2b8a3e">Y</text>
  <text x="40" y="150" font-size="14" fill="#2b8a3e">Pitch</text>
  <text x="40" y="170" font-size="14" fill="#2b8a3e">= left-right axis (nodding)</text>

  <!-- Z axis (Yaw) - up -->
  <line x1="340" y1="250" x2="340" y2="70" stroke="#1971c2" stroke-width="3"/>
  <polygon points="340,70 334,82 346,82" fill="#1971c2"/>
  <text x="350" y="70" font-size="15" font-weight="bold" fill="#1971c2">Z</text>
  <path d="M 300 110 A 40 18 0 1 1 380 110" fill="none" stroke="#1971c2" stroke-width="2.5"/>
  <polygon points="380,110 371,103 369,116" fill="#1971c2"/>
  <text x="395" y="105" font-size="14" fill="#1971c2">Yaw = up-down axis (turning head)</text>

  <text x="320" y="450" font-size="13" text-anchor="middle" fill="#666">"Attitude" = which way it faces now, expressed by these three rotations</text>
</svg>
