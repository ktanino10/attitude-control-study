<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="sans-serif">
  <rect width="720" height="380" fill="#ffffff"/>
  <text x="360" y="32" font-size="20" font-weight="bold" text-anchor="middle" fill="#222">How a reaction wheel works (action &amp; reaction)</text>

  <!-- left: the module -->
  <g transform="translate(200,210)">
    <rect x="-110" y="-110" width="220" height="220" rx="12" fill="#f1ecf9" stroke="#5a3d8a" stroke-width="3"/>
    <text x="0" y="-125" font-size="14" text-anchor="middle" fill="#5a3d8a">Body (satellite)</text>

    <!-- wheel -->
    <circle cx="0" cy="0" r="70" fill="#cfe8d8" stroke="#2b8a3e" stroke-width="3"/>
    <circle cx="0" cy="0" r="8" fill="#2b8a3e"/>
    <text x="0" y="95" font-size="13" text-anchor="middle" fill="#2b8a3e">Internal wheel</text>

    <!-- wheel spin CW -->
    <path d="M 0 -50 A 50 50 0 0 1 43 25" fill="none" stroke="#2b8a3e" stroke-width="4"/>
    <polygon points="43,25 33,22 40,13" fill="#2b8a3e"/>
    <text x="20" y="-30" font-size="13" fill="#2b8a3e" font-weight="bold">spins CW</text>

    <!-- body spin CCW -->
    <path d="M -140 -30 A 150 150 0 0 0 -140 30" fill="none" stroke="#d9480f" stroke-width="4"/>
    <polygon points="-140,30 -134,19 -147,21" fill="#d9480f"/>
    <text x="-200" y="0" font-size="13" fill="#d9480f" font-weight="bold">body turns</text>
    <text x="-200" y="18" font-size="13" fill="#d9480f" font-weight="bold">CCW</text>
  </g>

  <!-- arrow -->
  <text x="380" y="215" font-size="34" fill="#adb5bd">≈</text>

  <!-- right: spinning chair analogy -->
  <g transform="translate(560,210)">
    <text x="0" y="-125" font-size="14" text-anchor="middle" fill="#333">Spinning-chair analogy</text>
    <circle cx="0" cy="-40" r="20" fill="#ffe8cc" stroke="#d9820f" stroke-width="2"/>
    <rect x="-14" y="-20" width="28" height="45" rx="6" fill="#d0bfff" stroke="#5a3d8a" stroke-width="2"/>
    <rect x="-30" y="30" width="60" height="10" fill="#adb5bd"/>
    <line x1="0" y1="40" x2="0" y2="70" stroke="#868e96" stroke-width="4"/>
    <!-- wheel in hands -->
    <circle cx="45" cy="-5" r="16" fill="#cfe8d8" stroke="#2b8a3e" stroke-width="2"/>
    <path d="M 45 -21 A 16 16 0 0 1 61 -5" fill="none" stroke="#2b8a3e" stroke-width="3"/>
    <polygon points="61,-5 53,-8 57,-14" fill="#2b8a3e"/>
    <text x="-75" y="90" font-size="12" fill="#666">Spin a wheel held in your hands</text>
    <text x="-75" y="107" font-size="12" fill="#666">and you (the chair) turn the other way</text>
  </g>

  <text x="360" y="355" font-size="13" text-anchor="middle" fill="#333">Spinning only an internal wheel turns the body — no external force needed (works in space too)</text>
</svg>
